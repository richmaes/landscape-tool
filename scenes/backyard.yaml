# The real backyard concept, converted from extraction/objects.json
# (itself extracted from backyard concept.pdf) into the M2 scene schema.
# This is the M1 task "Convert objects.json into the first real scene
# YAML once M2 lands."
#
# This is the live, editable design. (On 2026-09-25 its page grew from 24
# to 36 ft for the brick patio and every object moved +6 ft in x and y, so
# coordinates here are 6 ft more than the PDF-frame values in
# extraction/objects.md.) It started as a faithful copy of the
# extracted geometry AND its known design flaws (see extraction/objects.md
# "Geometric findings"); that original is frozen, for the tests that check
# rules/backyard.yaml flags exactly those flaws, as
# tests/fixtures/backyard_original.yaml. Design changes since (e.g. the
# firepit keep-out recentred and shrunk, 2026-09-24) are recorded in
# TODO.md's Decision record.
#
# Materials left unassigned (rendering as the fallback color) are ones
# extraction/objects.json's own "materials_identified" section marks
# TBD/unknown, not omissions: firepit and both water features have no
# chosen material or form yet.

units: ft
page_width: 36
page_height: 36
scale: 36
layers: [ground, structures, annotation]
palette: pastel_v1

objects:
  # The existing brick patio: 36 x 36 ft of light grey pavers in a 45-degree
  # herringbone, centred on the sand circle, with the circle and its border
  # cut out of it. (The page grew from 24 to 36 ft for it on 2026-09-25, and
  # everything else moved 6 ft right and up to stay centred.)
  - id: brick_patio
    type: rect
    x: 0
    y: 0
    width: 36
    height: 36
    boolean: {op: difference, targets: [sand_circle_border, site_circle]}
    material: pavers_light_grey
    pattern: herringbone_45
    layer: ground
    z: -2

  # One course of border bricks laid lengthwise around the sand circle
  # (a sailor course): a 4 in ring, kept centred on the circle.
  - id: sand_circle_border
    type: circle
    cx: 18
    cy: 18
    r: 12.333
    center_of: site_circle
    boolean: {op: difference, targets: [site_circle]}
    material: pavers_light_grey
    pattern: sailor
    layer: ground
    z: -1

  - id: existing_vinyl_fence
    type: fence_line
