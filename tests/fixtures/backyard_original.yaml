# FROZEN TEST FIXTURE — do not edit. A snapshot of scenes/backyard.yaml as
# converted from extraction/objects.json (commit cdec3fc), before any design
# changes. Tests that check the documented design flaws in
# extraction/objects.md load this, so the live scenes/backyard.yaml can evolve
# without breaking them.
# The real backyard concept, converted from extraction/objects.json
# (itself extracted from backyard concept.pdf) into the M2 scene schema.
# This is the M1 task "Convert objects.json into the first real scene
# YAML once M2 lands."
#
# Faithfully reproduces the actual extracted geometry AND its known,
# still-unresolved design flaws (see extraction/objects.md "Geometric
# findings") rather than a corrected version — rules/backyard.yaml is
# built to flag exactly those flaws automatically, as a real test of the
# M3b rule checker against real data, not a synthetic fixture.
#
# Materials left unassigned (rendering as the fallback color) are ones
# extraction/objects.json's own "materials_identified" section marks
# TBD/unknown, not omissions: firepit and both water features have no
# chosen material or form yet.

