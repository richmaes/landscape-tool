# Rule instances for the real backyard design (scenes/backyard.yaml),
# mirroring the findings Rich already documented by hand in
# extraction/objects.md "Geometric findings" — this is a real test of
# whether the M3b rule checker reproduces known, real design flaws
# automatically, not a synthetic demo like rules/default.yaml.

rules:
  - id: no_burnable_in_firepit_keepout
    type: keepout_material_exclusion
    zone_rule: no_burnable_material
    excluded_materials: [sand_tbd, deck]
    # expected to fire: sand_tbd only (site_circle isn't carved out around
    # the keepout). deck_s does NOT fire here: measured against the
    # keepout circle as actually drawn, deck_s is 0.675 ft clear of it.
    # extraction/objects.json's "deck_intrudes_on_keepout" (0.085 ft) is a
    # different, hypothetical measurement — distance from the firepit's
    # own center, i.e. what the clearance would be *if* the keepout gets
    # recentered on the firepit first (see the concentricity rule below).

  - id: firepit_keepout_concentric
    type: concentricity
    tolerance: 0.01
    pairs:
      - {zone: firepit_keepout, center: firepit}
    # expected to fire: firepit sits 0.792 ft off the keepout's center
    # ("keepout_not_centred_on_firepit")

  - id: firepit_keepout_contained_by_site
    type: containment
    tolerance: 0.0
    pairs:
      - {zone: firepit_keepout, parent: site_circle}
    # expected to fire: the keepout overhangs the site circle by 1.819 ft
    # to the south-west ("keepout_escapes_burnable_area")

  - id: no_unintended_overlaps
    type: no_overlap_unless_stacked
    ignore_materials: [sand_tbd]
    exceptions:
      - [hot_tub, hot_tub_pad]         # the tub sits on its pad by design
      - [deck_nw_wood, deck_nw_green]
      - [deck_ne_wood, deck_ne_green]
      - [hot_tub_pad, deck_nw_green]   # the deck wraps and overlaps the pad by design
      - [hot_tub_pad, deck_ne_green]
      - [hot_tub_pad, deck_nw_wood]
      - [hot_tub_pad, deck_ne_wood]
      - [hot_tub_pad, deck_e]
      - [hot_tub_pad, deck_w]
      - [hot_tub_pad, deck_s]
      - [deck_e, deck_s]               # adjoining deck sections
      - [deck_w, deck_s]
      - [firepit, firepit_keepout]     # the keepout is meant to contain the firepit
