# Starter material library (M4). `solid: {base, height}` (feet) is a
# material's default third dimension for the 3D view (M11) — objects can set
# their own; ground surfaces leave it out and stay flat.
#
# (M4 notes:) Kept separate from any scene file so a
# palette can be swapped without touching scene YAML. `color` is the flat
# fill for M5 and the watercolor pigment for M6's art mode; `edge` is the
# flat-mode outline. `texture` is art mode's pencil recipe
# (src/landscape/render_art.py): `style: hatch` (+ `direction` degrees,
# `spacing` ft), `stipple` (+ `density`), `ripple` (+ `spacing` ft),
# `scallop` (tree crowns), or `none`.

materials:
  lawn:
    name: Lawn
    color: "#B7D9A8"
    texture: {style: none}
    edge: {weight: 0.5, color: null}

  planting_bed:
    name: Planting Bed
    color: "#C9A97E"
    texture: {style: none}
    edge: {weight: 0.5, color: null}

  mulch:
    name: Mulch
    color: "#A9744F"
    texture: {style: none}
    edge: {weight: 0.5, color: null}

  gravel:
    name: Gravel
    color: "#D6D2C4"
    texture: {style: stipple, density: 0.4}
    edge: {weight: 0.5, color: null}

  flagstone:
    name: Flagstone
    color: "#9FB4C7"
    texture: {style: none}
    edge: {weight: 1.0, color: null}

  concrete:
    name: Concrete
    color: "#CBCBD1"
    texture: {style: none}
    edge: {weight: 0.75, color: null}

  # Decking comes in a few wood colors (the `deck` family): alternatives for
  # the same surface, so the palette check only compares them to other
  # materials. All share the same hatch texture.
  deck:
    solid: {height: 1.5}
    name: Deck (natural)
    family: deck
    color: "#E0B27A"
    texture: {style: hatch, direction: 45}
    edge: {weight: 1.0, color: null}

  deck_dark:
    solid: {height: 1.5}
    name: Deck (dark wood)
    family: deck
    color: "#6F4A35"
    texture: {style: hatch, direction: 45}
    edge: {weight: 1.0, color: null}

  deck_cedar:
    solid: {height: 1.5}
    name: Deck (cedar)
    family: deck
    color: "#CE8A5A"
    texture: {style: hatch, direction: 45}
    edge: {weight: 1.0, color: null}

  deck_weathered:
    solid: {height: 1.5}
    name: Deck (weathered grey)
    family: deck
    color: "#BFB6A8"
    texture: {style: hatch, direction: 45}
    edge: {weight: 1.0, color: null}

  water:
    name: Water
    color: "#9AC6D6"
    texture: {style: ripple}
    edge: {weight: 1.0, color: "#5C8A9A"}

  stone_wall:
    name: Stone Wall
    color: "#9B8F87"
    texture: {style: none}
    edge: {weight: 1.5, color: null}

  # Fences (the `fence` family): a plain one, and two with a fence recipe —
  # `style: fence` with the boards (vinyl or cedar), their width and gap in
  # inches, and posts every `post_spacing` feet, `post_size_in` square.
  # Posts show on the plan; in 3D the panel is slatted or boarded between
  # taller posts (see src/landscape/fences.py).
  fence:
    name: Fence (natural)
    family: fence
    solid: {height: 6}
    color: "#E4DCC8"
    texture: {style: none}
    edge: {weight: 1.0, color: null}

  fence_vinyl:
    name: Fence (white vinyl slats)
    family: fence
    solid: {height: 6}
    color: "#F2F1EC"
    texture: {style: fence, boards: vinyl, slat_width_in: 6, gap_in: 0.5, post_spacing: 8, post_size_in: 5}
    edge: {weight: 1.0, color: "#B8B6AE"}

  fence_cedar:
    name: Fence (cedar)
    family: fence
    solid: {height: 6}
    color: "#A5603A"
    texture: {style: fence, boards: cedar, slat_width_in: 5.5, gap_in: 0.25, post_spacing: 8, post_size_in: 4}
    edge: {weight: 1.0, color: null}

  tree_canopy:
    name: Tree / Shrub Canopy
    color: "#7FA66B"
    texture: {style: scallop}
    edge: {weight: 1.0, color: null}

  # Provisional, not a real starter material: matches the sand fill Rich
  # used as a placeholder in backyard concept.pdf for site_circle, whose
  # actual burnable ground material is still an open TODO.md item. Kept
  # separate from the 11 starter materials above so it's obvious this one
  # is a stand-in, not a finished decision.
  sand_tbd:
    name: Sand (placeholder)
    color: "#E8DCC0"
    texture: {style: none}
    edge: {weight: 0.5, color: null}

  # Pavers (art/flat texture style `pavers`). One material per color, all in
  # the `pavers` family; `brick` is [length, width] in inches, `pattern` is
  # the default layout (herringbone_45, herringbone_90, running_bond,
  # basketweave, or sailor for a border course) and any object can choose
  # its own with `pattern:`. `variation` is how much one brick's tone
  # differs from the next — highest for the blend.
  pavers_light_grey:
    name: Pavers (light grey)
    family: pavers
    color: "#D2D4D6"
    texture: {style: pavers, pattern: herringbone_45, brick: [8, 4], variation: 0.05}
    edge: {weight: 0.5, color: null}

  pavers_red:
    name: Pavers (classic red)
    family: pavers
    color: "#C98A77"
    texture: {style: pavers, pattern: herringbone_45, brick: [8, 4], variation: 0.06}
    edge: {weight: 0.5, color: null}

  pavers_red_blend:
    name: Pavers (red blend)
    family: pavers
    color: "#C28470"
    texture: {style: pavers, pattern: herringbone_45, brick: [8, 4], variation: 0.16}
    edge: {weight: 0.5, color: null}

  pavers_tan:
    name: Pavers (tan)
    family: pavers
    color: "#E0CC8A"
    texture: {style: pavers, pattern: herringbone_45, brick: [8, 4], variation: 0.06}
    edge: {weight: 0.5, color: null}

  pavers_charcoal:
    name: Pavers (charcoal)
    family: pavers
    color: "#96989C"
    texture: {style: pavers, pattern: herringbone_45, brick: [8, 4], variation: 0.05}
    edge: {weight: 0.5, color: null}
